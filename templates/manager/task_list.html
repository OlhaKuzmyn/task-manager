{% extends "base.html" %}

{% block content %}
  {% if task_list %}
    <ul>
      {% for task in task_list %}
        <li>
          <a href="{% url 'manager:task-detail' pk=task.id %}">
            Task name: {{ task.name }}
            Project name: {{ task.project.name }}
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
  <p>No tasks found.</p>
  {% endif %}
{% endblock %}

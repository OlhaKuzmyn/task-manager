{% extends "base.html" %}

{% block content %}
  <h1>Tasks</h1>
    {% if task_list %}
    {% include "includes/search.html" %}
      <ul>
        {% for task in task_list %}
          <li>
            <a href="{% url 'manager:task-detail' pk=task.id %}">
              Task name: {{ task.name }}
              Project name: {{ task.project.name }}
            </a>
          </li>
        {% endfor %}
      </ul>
    {% else %}
    <p>No tasks found.</p>
    {% endif %}
{% endblock %}

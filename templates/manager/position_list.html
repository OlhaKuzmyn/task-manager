{% extends "base.html" %}

{% block content %}
  {% if position_list %}
    <ul>
      {% for position in position_list %}
        <li>
          {{ position.name }}
        </li>
      {% endfor %}
    </ul>
  {% else %}
  <p>No positions found.</p>
  {% endif %}
  {% if perms.position.add_position %}
      <a href="{% url 'manager:position-create' %}" class="btn btn-primary">Add position</a>
  {% endif %}
{% endblock %}

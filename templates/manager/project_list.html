{% extends "base.html" %}

{% block content %}
  {% if project_list %}
    <ul>
      {% for project in project_list %}
        <li>
          <a href="{% url 'manager:project-detail' pk=project.id %}">
            {{ project.name }}
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
  <p>No projects found.</p>
  {% endif %}
  {% if perms.project.add_project %}
      <a href="{% url 'manager:project-create' %}" class="btn btn-primary">Add project</a>
  {% endif %}
{% endblock %}

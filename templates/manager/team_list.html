{% extends "base.html" %}

{% block content %}
  <h1>Teams</h1>
    {% if team_list %}
      <ul>
        {% for team in team_list %}
          <li>
            <a href="{% url 'manager:team-detail' pk=team.id %}">
              {{ team.name }}
            </a>
          </li>
        {% endfor %}
      </ul>
    {% else %}
    <p>No teams found.</p>
    {% endif %}
{% endblock %}
